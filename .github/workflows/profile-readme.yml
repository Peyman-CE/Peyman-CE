name: Update README cards
on:
  schedule:
    - cron: "0 3 * * *" # Runs once daily at 03:00 UTC
  workflow_dispatch: # Lets you run it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/profile-readme.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=default&hide_border=true&count_private=true&title_color=2C5364&icon_color=2C5364"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=default&hide_border=true&langs_count=8&title_color=2C5364"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      # Your own repo
      - name: Generate pin card - Property Pulse
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: "username=Peyman-CE&repo=Property_Pulse_Nextjs&theme=default&hide_border=true&title_color=2C5364"
          path: profile/pin-property-pulse.svg
          token: ${{ secrets.STATS_TOKEN }}

      # Collaboration repos - owner must be hardcoded since it isn't your account
      - name: Generate pin card - Tweeter_Demo
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: "username=Soroush-Eghdami&repo=Tweeter_Demo&theme=default&hide_border=true&title_color=2C5364&show_owner=true"
          path: profile/pin-tweeter-demo.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate pin card - Socially App
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: "username=mahzadkhosraviani&repo=socially-app-project&theme=default&hide_border=true&title_color=2C5364&show_owner=true"
          path: profile/pin-socially-app.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate pin card - Quera Task Manager
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: "username=NastaranAd83&repo=Quera-task-manager&theme=default&hide_border=true&title_color=2C5364&show_owner=true"
          path: profile/pin-quera-task-manager.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=${{ github.repository_owner }}&theme=default&hide_border=true&stroke=2C5364&ring=2C5364&fire=2C5364&currStreakLabel=2C5364"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase origin main
          git push
